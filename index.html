<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KAMIL — CGI ARTIST</title>
  <meta name="description" content="Kamil — CGI artist. Unreal Engine, Blender, After Effects. Selected work." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cloofen-site.vercel.app/" />
  <meta property="og:title" content="KAMIL — CGI ARTIST" />
  <meta property="og:description" content="Unreal Engine, Blender, After Effects. Selected work." />
  <meta property="og:image" content="https://cloofen-site.vercel.app/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#000000" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='bold' fill='%2300ffa8' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <!-- постеры решают первый экран: они видны сразу, видео дотягивается следом -->
  <link rel="preload" as="image" href="media/byreal.jpg" />
  <link rel="preload" as="image" href="media/solayer.jpg" />
  <link rel="preload" as="image" href="media/mr-stephen.jpg" />

  <style>
    /* Подмножество ASCII в woff2: 3 КБ вместо 343 КБ исходного ttf.
       Пересобрать после смены имени или символов бинарного фона:
       python -m fontTools.subset OffBit-Bold.ttf --unicodes="U+0020-007E" \
         --flavor=woff2 --layout-features="" --no-hinting --desubroutinize \
         --output-file=offbit-bold.woff2 */
    @font-face {
      font-family: 'OffBit';
      src: url('offbit-bold.woff2') format('woff2');
      font-weight: bold;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --fg: #ffffff;
      --bg: #000000;
      --accent: #00ffa8;
      --dim: #555;
      --mono: 'Share Tech Mono', ui-monospace, 'Courier New', monospace;
      --gap: 12px;
      --pad: clamp(16px, 3vw, 40px);
    }

    /* overflow-x задаём ТОЛЬКО на html — он пробрасывается на вьюпорт.
       Если продублировать его на body вместе с height:100%, body становится
       собственным скролл-контейнером и документ перестаёт скроллиться. */
    html {
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: var(--fg);
      font-family: var(--mono);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 75% 60% at 50% 18%, #001b0d 0%, #000a05 45%, #000000 78%);
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ─── PAGE ─── */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(22px, 3.4vh, 34px);
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--pad);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .head, .works__grid, .hint {
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
    }
    .head        { animation-delay: 0.15s; }
    .hint        { animation-delay: 0.30s; }
    .works__grid { animation-delay: 0.40s; }

    /* ─── HEAD ─── */
    .head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px 40px;
    }

    /* Роль живёт в углу страницы, а не в потоке шапки */
    .corner {
      position: absolute;
      top: var(--pad);
      left: var(--pad);
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .head__name {
      font-family: 'OffBit', var(--mono);
      font-weight: bold;
      font-size: clamp(26px, 2.8vw, 38px);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .head__meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 14px;
    }

    .head__meta span {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .head__meta span b {
      color: var(--fg);
      font-weight: normal;
    }

    /* Акцент держим размером, а не заливкой */
    .head__tg {
      flex-shrink: 0;
      padding: 17px 38px;
      border: 1px solid var(--accent);
      color: var(--accent);
      text-decoration: none;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      transition: background 0.15s, color 0.15s;
    }

    .head__tg:hover,
    .head__tg:focus-visible {
      background: var(--accent);
      color: var(--bg);
      outline: none;
    }

    .hint {
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: -14px;
    }

    /* ─── WORKS ─── */
    .works__grid {
      --gw: min(1400px, calc(100vw - var(--pad) * 2));
      --cell: calc((var(--gw) - 2 * var(--gap)) / 3);
      width: 100%;
      height: calc(var(--cell) * 0.5625 * 2 + var(--gap));
      max-height: calc(100vh - 300px);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: var(--gap);
      transition: grid-template-columns 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  grid-template-rows    0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .works__card {
      position: relative;
      display: block;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      cursor: pointer;
      background: #0a0a0a;
      border: 1px solid #ffffff10;
      padding: 0;
      font: inherit;
      color: inherit;
      text-align: left;
      transition: filter 0.6s ease, opacity 0.6s ease, border-color 0.4s ease;
    }

    .works__card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .works__grid.has-hover .works__card {
      filter: brightness(0.3) blur(2px);
      opacity: 0.6;
    }

    .works__grid.has-hover .works__card.is-active {
      filter: none;
      opacity: 1;
      border-color: #00ffa855;
    }

    .works__card:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -1px;
    }

    .works__card__idx {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #ffffff66;
      text-shadow: 0 1px 4px #000;
    }

    .works__card__label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .works__card__label b {
      display: block;
      font-size: 12px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .works__card__label i {
      display: block;
      margin-top: 3px;
      font-style: normal;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .works__card:hover .works__card__label,
    .works__card:focus-visible .works__card__label,
    .works__card.is-active .works__card__label { opacity: 1; }

    /* ─── LIGHTBOX ─── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .lightbox.active { display: flex; }

    .lightbox video {
      max-width: 92vw;
      max-height: 86vh;
      background: #000;
    }

    .lightbox__close {
      position: absolute;
      top: 18px;
      right: 24px;
      font-family: var(--mono);
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }
    .lightbox__close:hover { color: var(--accent); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 860px) {
      /* запас сверху, чтобы шапка не наехала на угловую метку */
      .page { justify-content: flex-start; padding-top: 58px; gap: 24px; }

      .head {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }
      .head__meta span { font-size: 13px; }
      .head__tg { padding: 15px 30px; font-size: 14px; }

      .hint { display: none; }

      .works__grid {
        height: auto;
        max-height: none;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: none;
        gap: 8px;
      }
      .works__card { aspect-ratio: 16 / 9; }
      .works__card__label { opacity: 1; }
      .works__grid.has-hover .works__card { filter: none; opacity: 1; }
    }

    @media (max-width: 460px) {
      .works__grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .head, .works__grid, .hint { opacity: 1; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <main class="page">

    <span class="corner">/ CGI Artist</span>

    <header class="head">
      <div>
        <h1 class="head__name">Kamil</h1>
        <div class="head__meta">
          <span>AGE — <b>20</b></span>
          <span>SOFTWARE — <b>UNREAL ENGINE, BLENDER, AFTER EFFECTS</b></span>
        </div>
      </div>

      <a class="head__tg" href="https://t.me/cloofenm" target="_blank" rel="noopener">/ Write on Telegram</a>
    </header>

    <p class="hint">/ hover to expand — click to play</p>

    <div class="works__grid" id="works-grid">

      <button class="works__card" type="button" data-slug="byreal">
        <video src="media/byreal-preview.mp4" poster="media/byreal.jpg" muted loop playsinline preload="metadata"></video>
        <span class="works__card__idx">01</span>
        <span class="works__card__label"><b>Byreal</b><i>Product film — Bybit</i></span>
      </button>

      <button class="works__card" type="button" data-slug="solayer">
        <video src="media/solayer-preview.mp4" poster="media/solayer.jpg" muted loop playsinline preload="metadata"></video>
        <span class="works__card__idx">02</span>
        <span class="works__card__label"><b>Solayer</b><i>Product 3D — card launch</i></span>
      </button>

      <button class="works__card" type="button" data-slug="mr-stephen">
        <video src="media/mr-stephen-preview.mp4" poster="media/mr-stephen.jpg" muted loop playsinline preload="metadata"></video>
        <span class="works__card__idx">03</span>
        <span class="works__card__label"><b>Mr. Stephen</b><i>CG environment — short film</i></span>
      </button>

      <button class="works__card" type="button" data-slug="sentient">
        <video src="media/sentient-preview.mp4" poster="media/sentient.jpg" muted loop playsinline preload="metadata"></video>
        <span class="works__card__idx">04</span>
        <span class="works__card__label"><b>Sentient</b><i>CG world — concept &amp; animation</i></span>
      </button>

      <button class="works__card" type="button" data-slug="seismic">
        <video src="media/seismic-preview.mp4" poster="media/seismic.jpg" muted loop playsinline preload="metadata"></video>
        <span class="works__card__idx">05</span>
        <span class="works__card__label"><b>Seismic</b><i>Brand identity in 3D</i></span>
      </button>

      <button class="works__card" type="button" data-slug="checkout">
        <video src="media/checkout-preview.mp4" poster="media/checkout.jpg" muted loop playsinline preload="metadata"></video>
        <span class="works__card__idx">06</span>
        <span class="works__card__label"><b>Checkout</b><i>UI motion — interface animation</i></span>
      </button>

    </div>

  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lightbox-close" type="button" aria-label="Close">✕</button>
    <video id="lightbox-video" controls playsinline></video>
  </div>

  <script>
  (function () {
    'use strict';

    // ─── BINARY BACKGROUND ───
    (function () {
      var canvas = document.getElementById('bg-canvas');
      var ctx = canvas.getContext('2d');
      var SPACING = 16;
      var raf = null;

      function build() {
        var W = canvas.width  = window.innerWidth;
        var H = canvas.height = window.innerHeight;
        ctx.clearRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        var cols = Math.ceil(W / SPACING) + 1;
        var rows = Math.ceil(H / SPACING) + 1;

        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            var size  = 5 + Math.random() * 6;
            var alpha = 0.18 + Math.random() * 0.12;
            ctx.font = 'bold ' + size + 'px OffBit, monospace';
            ctx.fillStyle = 'rgba(0,60,30,' + alpha.toFixed(2) + ')';
            ctx.fillText(Math.random() > 0.5 ? '1' : '0', c * SPACING, r * SPACING);
          }
        }
      }

      window.addEventListener('resize', function () {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(build);
      });
      build();
    })();

    // ─── GRID ───
    var grid  = document.getElementById('works-grid');
    var cards = Array.prototype.slice.call(grid.querySelectorAll('.works__card'));
    var COLS  = 3, ROWS = 2;
    var BIG_C = '1.7fr',  SML_C = '0.65fr';
    var BIG_R = '1.45fr', SML_R = '0.55fr';

    var canExpand = window.matchMedia('(hover: hover) and (min-width: 861px)');
    var resetTimer = null;

    function track(count, active, big, small) {
      var out = [];
      for (var i = 0; i < count; i++) out.push(i === active ? big : small);
      return out.join(' ');
    }

    function expand(i) {
      if (!canExpand.matches) return;
      clearTimeout(resetTimer);
      grid.style.gridTemplateColumns = track(COLS, i % COLS, BIG_C, SML_C);
      grid.style.gridTemplateRows    = track(ROWS, Math.floor(i / COLS), BIG_R, SML_R);
      grid.classList.add('has-hover');
      cards.forEach(function (c) { c.classList.remove('is-active'); });
      cards[i].classList.add('is-active');
    }

    function collapse() {
      resetTimer = setTimeout(function () {
        grid.style.gridTemplateColumns = '';
        grid.style.gridTemplateRows    = '';
        grid.classList.remove('has-hover');
        cards.forEach(function (c) { c.classList.remove('is-active'); });
      }, 120);
    }

    cards.forEach(function (card, i) {
      card.addEventListener('mouseenter', function () { expand(i); });
      card.addEventListener('focus',      function () { expand(i); });
      card.addEventListener('click',      function () { openLightbox(card); });

      card.addEventListener('keydown', function (e) {
        var next = null;
        if (e.key === 'ArrowRight')     next = i + 1;
        else if (e.key === 'ArrowLeft') next = i - 1;
        else if (e.key === 'ArrowDown') next = i + COLS;
        else if (e.key === 'ArrowUp')   next = i - COLS;
        if (next !== null && cards[next]) { e.preventDefault(); cards[next].focus(); }
      });
    });

    grid.addEventListener('mouseleave', collapse);
    grid.addEventListener('focusout', function (e) {
      if (!grid.contains(e.relatedTarget)) collapse();
    });
    canExpand.addEventListener('change', function () {
      grid.style.gridTemplateColumns = '';
      grid.style.gridTemplateRows    = '';
      grid.classList.remove('has-hover');
    });

    // ─── PREVIEW PLAYBACK ───
    // Десктоп: все превью крутятся. Мобильный: играет только видимое —
    // шесть одновременных декодов сажают батарею и тормозят скролл.
    function play(v) {
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    }

    var videos = cards.map(function (c) { return c.querySelector('video'); });

    if (canExpand.matches) {
      videos.forEach(function (v) { v.preload = 'auto'; play(v); });
    } else if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          var v = e.target.querySelector('video');
          if (e.isIntersecting) { v.preload = 'auto'; play(v); } else { v.pause(); }
        });
      }, { threshold: 0.5 });
      cards.forEach(function (c) { io.observe(c); });
    }

    // ─── LIGHTBOX ───
    var lb        = document.getElementById('lightbox');
    var lbVideo   = document.getElementById('lightbox-video');
    var lbClose   = document.getElementById('lightbox-close');
    var lastFocus = null;

    function openLightbox(card) {
      lastFocus = card;
      lbVideo.src = 'media/' + card.dataset.slug + '.mp4';
      lb.classList.add('active');
      videos.forEach(function (v) { v.pause(); });
      play(lbVideo);
      lbClose.focus();
    }

    function closeLightbox() {
      if (!lb.classList.contains('active')) return;
      lb.classList.remove('active');
      lbVideo.pause();
      lbVideo.removeAttribute('src');
      lbVideo.load();
      if (canExpand.matches) videos.forEach(play);
      if (lastFocus) lastFocus.focus();
    }

    lb.addEventListener('click', function (e) { if (e.target === lb) closeLightbox(); });
    lbClose.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  })();
  </script>

</body>
</html>
